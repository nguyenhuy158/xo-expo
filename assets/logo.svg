<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#FFE0EC"/>
    </linearGradient>
    <style>
      .ol { stroke:#fff; stroke-width:44; stroke-linejoin:round; stroke-linecap:round; }
      .ink { fill:#3B3140; }
    </style>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="60" y="60" width="904" height="904" rx="185" fill="none" stroke="#fff" stroke-width="26"/>

  <!-- grid, kawaii chunky -->
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" opacity=".9">
    <path d="M372 210 V814 M652 210 V814 M210 372 H814 M210 652 H814"/>
  </g>

  <!-- X, pink, top-left cell -->
  <g transform="translate(291 291)">
    <g class="ol" stroke-linecap="round" fill="none">
      <path d="M-58 -58 L58 58 M58 -58 L-58 58" stroke="#fff" stroke-width="118"/>
    </g>
    <path d="M-58 -58 L58 58 M58 -58 L-58 58" stroke="#FF7BA9" stroke-width="74" stroke-linecap="round" fill="none"/>
    <g class="ink">
      <ellipse cx="-20" cy="-4" rx="9" ry="12"/>
      <ellipse cx="20" cy="-4" rx="9" ry="12"/>
      <path d="M-12 18 q12 12 24 0" fill="none" stroke="#3B3140" stroke-width="8" stroke-linecap="round"/>
    </g>
    <ellipse cx="-44" cy="16" rx="14" ry="8" fill="#FF9EC0" opacity=".85"/>
    <ellipse cx="44" cy="16" rx="14" ry="8" fill="#FF9EC0" opacity=".85"/>
  </g>

  <!-- O, blue, center cell -->
  <g transform="translate(512 512)">
    <circle r="90" fill="none" stroke="#fff" stroke-width="118"/>
    <circle r="90" fill="none" stroke="#63B8F5" stroke-width="74"/>
    <g class="ink">
      <ellipse cx="-30" cy="-6" rx="10" ry="14"/>
      <ellipse cx="30" cy="-6" rx="10" ry="14"/>
      <path d="M-14 24 q14 16 28 0" fill="none" stroke="#3B3140" stroke-width="9" stroke-linecap="round"/>
    </g>
    <ellipse cx="-58" cy="18" rx="15" ry="9" fill="#FFA6C6" opacity=".8"/>
    <ellipse cx="58" cy="18" rx="15" ry="9" fill="#FFA6C6" opacity=".8"/>
  </g>

  <!-- X, mint, bottom-right cell -->
  <g transform="translate(733 733)">
    <path d="M-52 -52 L52 52 M52 -52 L-52 52" stroke="#fff" stroke-width="112" stroke-linecap="round" fill="none"/>
    <path d="M-52 -52 L52 52 M52 -52 L-52 52" stroke="#7FD8A9" stroke-width="70" stroke-linecap="round" fill="none"/>
    <g class="ink">
      <circle cx="-18" cy="-4" r="8"/>
      <circle cx="18" cy="-4" r="8"/>
      <path d="M-10 16 q10 10 20 0" fill="none" stroke="#3B3140" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#FFD34D">
    <path d="M840 190 l14 40 40 14 -40 14 -14 40 -14-40 -40-14 40-14z"/>
    <path d="M160 828 l11 31 31 11 -31 11 -11 31 -11-31 -31-11 31-11z"/>
  </g>

  <!-- wordmark ribbon -->
  <g transform="translate(512 900)">
    <rect x="-300" y="-62" width="600" height="124" rx="62" fill="#fff"/>
    <rect x="-282" y="-46" width="564" height="92" rx="46" fill="#FF7BA9"/>
    <text x="0" y="16" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-weight="bold"
          font-size="64" fill="#fff" letter-spacing="2">XO vui vẻ</text>
  </g>
</svg>
